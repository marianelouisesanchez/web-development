<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My College Adventures</title>

  <link rel="icon" href="LogoR.svg" type="image/svg+xml">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Pinyon+Script&display=swap"
  rel="stylesheet">
  <style>
    body {
      color: #f8efec;
      background: linear-gradient(115deg, #4b1723 0%, #682a35 100%);
      font-family: 'Manrope', sans-serif;
    }

    .title {
      width: min(100% - 48px, 1620px);
    }

    .heading h1 {
      color: #fff3ee;
      font-family: 'DM Sans', cursive;
      font-size: 80px;
      font-weight: 400;
      line-height: 1.12;
    }

    .card {
      min-height: 125px;
      overflow: hidden;
      border: 1px solid rgba(255, 239, 235, 0.2);
      border-radius: 10px;
      background-color: rgba(255, 239, 235, 0.14);
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 20px rgba(35, 8, 15, 0.12);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }
    
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 6px;
      transition: transform 0.6s ease;
    }

    .text-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card h1 {
      font-family: 'DM Sans';
      font-size: 52px;
      font-weight: 400;
      line-height: 1.05;
      color: #fff3ee;
      margin: 0;
      text-shadow: 0 2px 12px rgba(35, 8, 15, 0.45);
    }

    .card h5 {
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.7;
      letter-spacing: 1px;
      color: #fff3ee;
      margin: 0;
      max-width: 340px;
    }

    .long {
      height: 385px;
    }

    .short {
      height: 125px;
    }
  </style>
</head>

<body>
  <main class="title mx-auto p-3">

    <div class="row">
      <div class="col-6">
        <div class="row">
          <div class="col-6 p-1">
            <div class="card p-1  short text-card">
              <h1><strong> MY COLLEGE ADVENTURES </strong></h1>
            </div>
          </div>
          <div class="col-6 p-1">
            <div class="card p-1 short text-card">
              <h5>A collage of my college experiences, travels and memories from 2024-2026.</h5>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-12 p-1">
            <div class="card p-1 long">
              <img src="static/images/1.jpg"
                class="img-fluid" alt="Binondo 2026">
            </div>
          </div>
        </div>
      </div>
    
      <div class="col-6">
        <div class="row">
          <div class="col-4 p-1">
            <div class="card p-1 long">
              <img src="static/images/2.jpg"
                class="img-fluid" alt="Luneta Park 2025">
            </div>
          </div>
          <div class="col-4 p-1">
            <div class="card p-1 long">
              <img src="static/images/3.jpg"
                class="img-fluid" alt="Binondo 2026">
            </div>
          </div>
          <div class="col-4 p-1">
            <div class="card p-1 long">
              <img src="static/images/4.jpg"
                class="img-fluid" alt="Imelda's Garden 2025">
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-12 p-1">
            <div class="card p-1 short">
              <img src="static/images/5.jpg"
                class="img-fluid" alt="Binondo 2026">
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="row">
      <div class="col-2 p-1">
        <div class="card p-1 short">
          <img src="static/images/6.jpeg"
                class="img-fluid" alt="Kanluran Cafe 2026">
        </div>
      </div>
      <div class="col-4 p-1">
        <div class="card p-1 short">
          <img src="static/images/7.jpg"
                class="img-fluid" alt="National Museum of Anthropology 2025">
        </div>
      </div>
      <div class="col-3 p-1">
        <div class="card p-1 short">
          <img src="static/images/8.JPG"
                class="img-fluid" alt="Tirahan 2026">
        </div>
      </div>
      <div class="col-3 p-1">
        <div class="card p-1 short">
          <img src="static/images/9.jpeg"
                class="img-fluid" alt="Intrams 2026">
        </div>
      </div>
    </div>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
